[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scigantic-who"
version = "0.1.0"
description = "Query every WHO Global Health Observatory indicator from a public parquet mirror over DuckDB (one query instead of 3,099 API calls), decode WHO's dimension codes, or fetch a fresh indicator from the live OData API in the same shape."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }
authors = [{ name = "Scigantic", email = "support@scigantic.com" }]
keywords = ["who", "global health observatory", "gho", "public health", "epidemiology", "health indicators", "duckdb"]
classifiers = [
  "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  "duckdb>=0.10,<2",
  "pandas>=1.5,<4",
  "pyarrow>=12,<23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "mypy>=1.10", "pandas-stubs"]

[project.urls]
Homepage = "https://scigantic.com"
Repository = "https://github.com/Scigantic/scigantic-who"
Issues = "https://github.com/Scigantic/scigantic-who/issues"
GHO = "https://www.who.int/data/gho"

[project.scripts]
scigantic-who = "scigantic_who.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scigantic_who = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scigantic_who"]

[tool.mypy]
strict = true
